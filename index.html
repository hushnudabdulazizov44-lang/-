<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диёрбек & Зуҳра</title>

<link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="hero">

<h1>Диёрбек & Зуҳра</h1>

<p>Сиз азизларни никоҳ тўйимизга таклиф этамиз</p>

<div class="envelope" id="openBtn">
    <div class="flap"></div>
    <div class="letter">
        💌<br>
        <span>Таклифномани очиш</span>
    </div>
</div>

</div>

<div class="card" 

<h2>💍 Никоҳ тўйи</h2>

<p><strong>📅 Сана:</strong> 4 сентябрь 2026 йил</p>

<p><strong>🕖 Вақт:</strong> 19:00</p>

<p><strong>📍 Манзил:</strong></p>

<p><b>Версал тўйхонаси</b></p>

<p>Туркистон шаҳри</p>

<h3>⏳ Тўй бошланишига қолди</h3>

<div class="countdown">
<div><span id="days">0</span><br>Кун</div>
<div><span id="hours">0</span><br>Соат</div>
<div><span id="minutes">0</span><br>Дақиқа</div>
<div><span id="seconds">0</span><br>Сония</div>
</div>

<h3 class="family">
🌸 Ганиевлар оиласи сизларни кутиб қолади! 🌸
</h3>

</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</body>
</html>
